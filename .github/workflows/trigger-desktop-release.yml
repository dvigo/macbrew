name: Trigger Desktop App Release Job

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Desktop Release Version (e.g. 1.1.0)'
        required: true
        default: '1.1.0'

jobs:
  trigger-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger macbrew-desktop Release Workflow
        run: |
          echo "Triggering release v${{ github.event.inputs.version }} on dvigo/macbrew-desktop repository..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/dvigo/macbrew-desktop/actions/workflows/release-desktop.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"${{ github.event.inputs.version }}\"}}"
