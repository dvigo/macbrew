<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Amber Fluid Gradient -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Inner Subtle Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Beer Mug Illustration -->
  <g transform="translate(136, 110)">
    <!-- Foam Top -->
    <path d="M 40,60 C 40,35 70,30 90,42 C 105,25 140,25 155,42 C 175,30 205,35 205,60 C 220,65 225,85 210,95 L 35,95 C 20,85 25,65 40,60 Z" fill="#ffffff"/>

    <!-- Glass Body -->
    <rect x="45" y="90" width="155" height="180" rx="20" fill="url(#amber-grad)"/>

    <!-- Glass Handle -->
    <path d="M 200,110 L 230,110 C 255,110 255,230 200,230 L 200,200 C 230,200 230,140 200,140 Z" fill="url(#amber-grad)"/>

    <!-- Glass Highlights / Bubbles -->
    <rect x="65" y="105" width="16" height="135" rx="8" fill="rgba(255, 255, 255, 0.35)"/>
    <circle cx="120" cy="180" r="8" fill="rgba(255, 255, 255, 0.4)"/>
    <circle cx="150" cy="210" r="6" fill="rgba(255, 255, 255, 0.3)"/>
    <circle cx="110" cy="220" r="5" fill="rgba(255, 255, 255, 0.3)"/>

    <!-- Terminal Prompt Overlay (>_) -->
    <path d="M 75,295 L 105,315 L 75,335" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="120" y1="335" x2="155" y2="335" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
